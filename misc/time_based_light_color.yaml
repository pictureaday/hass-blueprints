blueprint:
  name: Time-Based Light Color (Dynamic)
  description: >
    Automatically change a light's color and brightness based on the time of
    day, with a dynamic (unlimited) number of time periods. Add as many
    periods as you like, each with its own start time, color, and brightness.

    Periods are entered as a list, for example:

    ```
    - time: "06:00:00"
      color: [255, 244, 229]
      brightness: 100
    - time: "12:00:00"
      color: [255, 255, 255]
      brightness: 100
    - time: "18:00:00"
      color: [255, 147, 41]
      brightness: 80
    - time: "21:30:00"
      color: [255, 79, 0]
      brightness: 40
    ```

    The automation checks every minute and applies whichever period's start
    time has most recently passed (wrapping correctly around midnight).
  domain: automation
  input:
    light_target:
      name: Light(s)
      description: The light(s) to control.
      selector:
        target:
          entity:
            domain: light

    periods:
      name: Color Periods
      description: >
        A list of periods. Each item needs: time (24h "HH:MM:SS"),
        color (RGB as [r, g, b]), and brightness (1-100). Add or remove
        as many entries as you want.
      default:
        - time: "06:00:00"
          color: [255, 244, 229]
          brightness: 100
        - time: "12:00:00"
          color: [255, 255, 255]
          brightness: 100
        - time: "18:00:00"
          color: [255, 147, 41]
          brightness: 80
        - time: "21:30:00"
          color: [255, 79, 0]
          brightness: 40
      selector:
        object: {}

trigger:
  - platform: time_pattern
    minutes: "/1"
  - platform: homeassistant
    event: start

variables:
  periods: !input periods
  sorted_periods: "{{ periods | sort(attribute='time') }}"
  now_time: "{{ now().strftime('%H:%M:%S') }}"
  active_period: >
    {% set past = sorted_periods | selectattr('time', 'le', now_time) | list %}
    {{ past[-1] if past | length > 0 else sorted_periods[-1] }}

condition: []

action:
  - action: light.turn_on
    target: !input light_target
    data:
      rgb_color: "{{ active_period.color }}"
      brightness_pct: "{{ active_period.brightness }}"

mode: single