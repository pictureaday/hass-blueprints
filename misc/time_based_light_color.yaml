blueprint:
  name: Time-Based Light Color
  description: >
    Automatically change a light's color and brightness based on the time of
    day. Configure up to 4 time periods, each with its own start time, color,
    and brightness. The light switches to the matching color at each period's
    start time.
  domain: automation
  input:
    light_target:
      name: Light(s)
      description: The light(s) to control.
      selector:
        target:
          entity:
            domain: light

    period_1_time:
      name: Period 1 - Start Time
      description: Time this color period begins.
      default: "06:00:00"
      selector:
        time: {}
    period_1_color:
      name: Period 1 - Color
      default: [255, 244, 229]
      selector:
        color_rgb: {}
    period_1_brightness:
      name: Period 1 - Brightness (%)
      default: 100
      selector:
        number:
          min: 1
          max: 100
          unit_of_measurement: "%"

    period_2_time:
      name: Period 2 - Start Time
      description: Time this color period begins.
      default: "12:00:00"
      selector:
        time: {}
    period_2_color:
      name: Period 2 - Color
      default: [255, 255, 255]
      selector:
        color_rgb: {}
    period_2_brightness:
      name: Period 2 - Brightness (%)
      default: 100
      selector:
        number:
          min: 1
          max: 100
          unit_of_measurement: "%"

    period_3_time:
      name: Period 3 - Start Time
      description: Time this color period begins.
      default: "18:00:00"
      selector:
        time: {}
    period_3_color:
      name: Period 3 - Color
      default: [255, 147, 41]
      selector:
        color_rgb: {}
    period_3_brightness:
      name: Period 3 - Brightness (%)
      default: 80
      selector:
        number:
          min: 1
          max: 100
          unit_of_measurement: "%"

    period_4_time:
      name: Period 4 - Start Time
      description: Time this color period begins.
      default: "21:30:00"
      selector:
        time: {}
    period_4_color:
      name: Period 4 - Color
      default: [255, 79, 0]
      selector:
        color_rgb: {}
    period_4_brightness:
      name: Period 4 - Brightness (%)
      default: 40
      selector:
        number:
          min: 1
          max: 100
          unit_of_measurement: "%"

trigger:
  - platform: time
    at: !input period_1_time
    id: period_1
  - platform: time
    at: !input period_2_time
    id: period_2
  - platform: time
    at: !input period_3_time
    id: period_3
  - platform: time
    at: !input period_4_time
    id: period_4

action:
  - choose:
      - conditions:
          - condition: trigger
            id: period_1
        sequence:
          - action: light.turn_on
            target: !input light_target
            data:
              rgb_color: !input period_1_color
              brightness_pct: !input period_1_brightness
      - conditions:
          - condition: trigger
            id: period_2
        sequence:
          - action: light.turn_on
            target: !input light_target
            data:
              rgb_color: !input period_2_color
              brightness_pct: !input period_2_brightness
      - conditions:
          - condition: trigger
            id: period_3
        sequence:
          - action: light.turn_on
            target: !input light_target
            data:
              rgb_color: !input period_3_color
              brightness_pct: !input period_3_brightness
      - conditions:
          - condition: trigger
            id: period_4
        sequence:
          - action: light.turn_on
            target: !input light_target
            data:
              rgb_color: !input period_4_color
              brightness_pct: !input period_4_brightness

mode: single
